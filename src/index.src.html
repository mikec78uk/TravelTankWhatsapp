<title>TravelTank on WhatsApp</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap">
<style>
/* Layout concept: a review deck for three audiences. Each touchpoint pairs the real TravelTank screen (left, scaled)
   with a WhatsApp phone (right), driven by one stepper, with design / business / build notes beneath. */
:root{
  --bg:#F2F6F6; --surface:#FFFFFF; --surface-2:#E9F3F3; --ink:#0F2A2E; --muted:#4D666A; --line:#D5E2E3;
  --accent:#01747F; --accent-ink:#FFFFFF; --coral:#FE5C61; --wa:#168F4D; --wa-soft:#E2F5E9; --wa-line:#9BD9B3;
  --display:'Manrope','Roboto',system-ui,sans-serif; --body:'Roboto',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'Roboto Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1315; --surface:#111E21; --surface-2:#172A2E; --ink:#E5F0F1; --muted:#98B1B4; --line:#233a3f;
  --accent:#4DC4D0; --accent-ink:#06282C; --coral:#FF7A7E; --wa:#3FD17F; --wa-soft:#123325; --wa-line:#21603F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1315; --surface:#111E21; --surface-2:#172A2E; --ink:#E5F0F1; --muted:#98B1B4; --line:#233a3f;
  --accent:#4DC4D0; --accent-ink:#06282C; --coral:#FF7A7E; --wa:#3FD17F; --wa-soft:#123325; --wa-line:#21603F; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
.wrap{max-width:1240px;margin:0 auto}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.logo{height:26px;width:auto}.logo-w{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo-g{display:none}:root:not([data-theme="light"]) .logo-w{display:block}}
:root[data-theme="dark"] .logo-g{display:none}:root[data-theme="dark"] .logo-w{display:block}

/* top bar + tabs */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:18px 10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px}
.brand .x{width:1px;height:22px;background:var(--line)}
.brand .wa-name{display:flex;align-items:center;gap:7px;font-family:var(--display);font-weight:700;font-size:16px}
.brand .wa-name svg{width:20px;height:20px;color:var(--wa)}
.status{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:var(--surface)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:6px 0 14px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;scrollbar-width:thin}
.tab{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:500;color:var(--muted)}
.tab b{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--surface-2);color:var(--ink);font:700 11px var(--display)}
.tab[aria-current="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tab[aria-current="true"] b{background:rgba(255,255,255,.22);color:var(--accent-ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tab[aria-current="true"] b{background:rgba(0,0,0,.18)}}
:root[data-theme="dark"] .tab[aria-current="true"] b{background:rgba(0,0,0,.18)}

/* overview */
.hero{padding:18px 0 8px;max-width:820px}
.hero h1{font-size:clamp(28px,4.2vw,44px);line-height:1.08;font-weight:800}
.hero p{margin-top:14px;font-size:17px;color:var(--muted);max-width:66ch}
.sec{margin-top:40px}
.sec>h2{font-size:22px;font-weight:800}
.sec>.sub{color:var(--muted);margin-top:4px;max-width:70ch}
.obs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:16px}
.ob{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.ob q{font-family:var(--mono);font-size:12px;color:var(--muted);quotes:none;background:var(--surface-2);padding:6px 8px;border-radius:6px}
.ob strong{font-weight:700;font-size:15px}
.ob button{align-self:flex-start;margin-top:auto;background:none;border:0;padding:0;color:var(--accent);font-weight:600;font-size:13px;text-decoration:underline;text-underline-offset:3px}
.jm{margin-top:16px;overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 8px 20px}
.jm-grid{display:grid;grid-template-columns:repeat(7,minmax(128px,1fr));min-width:920px}
.jm-st{padding:0 10px;text-align:center}
.jm-st h4{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;height:32px;display:flex;align-items:flex-start;justify-content:center}
.jm-line{position:relative;height:30px;margin:2px 0 12px}
.jm-line::before{content:"";position:absolute;left:0;right:0;top:14px;border-top:2px dashed var(--line)}
.jm-line i{position:absolute;left:50%;top:7px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--surface);border:3px solid var(--accent)}
.jm-tp{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.jm-tp button{display:flex;gap:8px;align-items:flex-start;text-align:left;border:1px solid var(--wa-line);background:var(--wa-soft);border-radius:10px;padding:8px 9px;font-size:12.5px;line-height:1.3}
.jm-tp button b{flex:0 0 auto;display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--wa);color:#fff;font:700 12px var(--display)}
.jm-tp .later{border:1px dashed var(--line);background:transparent;border-radius:10px;padding:8px 9px;font-size:12.5px;line-height:1.3;color:var(--muted);text-align:left}
.jm-tp .later em{display:block;font-style:normal;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;margin-bottom:2px}
.tbl{margin-top:16px;overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:13.5px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td:first-child{font-weight:600}
.lv{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;border:1px solid var(--line)}
.lv.l{background:var(--wa-soft);border-color:var(--wa-line)}.lv.m{background:var(--surface-2)}.lv.h{border-color:var(--coral)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.card h3{font-size:16px;font-weight:800;margin-bottom:8px}
.card ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.card li::marker{color:var(--accent)}
.fine{margin-top:34px;font-size:12.5px;color:var(--muted);max-width:90ch}

/* scenario */
.scn-head{padding:14px 0 18px;max-width:860px}
.kicker{font-size:12px;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--accent)}
.scn-head h2{font-size:clamp(24px,3.4vw,34px);line-height:1.1;font-weight:800;margin-top:6px}
.scn-head .lede{margin-top:10px;font-size:16.5px;color:var(--muted)}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 352px;gap:28px;align-items:start}
.frame-bar{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.pill{font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 10px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.pill.ex{border-color:var(--wa-line);background:var(--wa-soft);color:var(--wa)}
.pill.nw{border-color:var(--coral);color:var(--coral)}
.browser{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 10px 30px rgba(8,40,44,.10)}
.b-bar{display:flex;align-items:center;gap:6px;padding:9px 12px;background:#E9EEEF;border-bottom:1px solid #D5DDDE}
.b-bar i{width:10px;height:10px;border-radius:50%;background:#C3CDCF}
.b-bar .url{flex:1;margin-left:10px;background:#fff;border-radius:6px;padding:3px 10px;font:12px var(--mono);color:#51666A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.viewport{position:relative;overflow:hidden;background:#F1F1F1}
.phone-col{position:sticky;top:64px}
.phone{width:340px;max-width:100%;margin:0 auto;border-radius:44px;background:#14191B;padding:11px;box-shadow:0 18px 40px rgba(8,40,44,.28)}
.scr{position:relative;border-radius:34px;overflow:hidden;background:#EFEAE2;height:640px;display:flex;flex-direction:column;font-family:var(--body);color:#111B21}
.st{display:flex;justify-content:space-between;padding:10px 24px 4px;font:600 12px var(--body);background:#008069;color:#fff}
.wh{display:flex;align-items:center;gap:9px;padding:6px 12px 9px;background:#008069;color:#fff}
.wh .back{font-size:20px;line-height:1}
.av{width:36px;height:36px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:0 0 auto;font:800 13px var(--display);color:#01747F}
.av.g{background:#D0DDDF;color:#34484C}
.wh .nm{font-weight:600;font-size:15.5px;line-height:1.15;display:flex;align-items:center;gap:5px}
.wh .nm svg{width:14px;height:14px}
.wh .sb{font-size:11.5px;opacity:.85;line-height:1.2}
.wh .ic{margin-left:auto;display:flex;gap:16px;opacity:.9;font-size:15px}
.wbody{flex:1;overflow-y:auto;padding:10px 10px 14px;display:flex;flex-direction:column;gap:5px;scroll-behavior:smooth;
  background-color:#EFEAE2;background-image:radial-gradient(rgba(0,0,0,.035) 1px,transparent 1.2px);background-size:14px 14px}
.wbody::-webkit-scrollbar{width:0}
.chip{align-self:center;background:#FFFFFFD9;color:#54656F;font-size:11.5px;padding:4px 10px;border-radius:8px;margin:5px 0;box-shadow:0 1px 1px rgba(0,0,0,.06);text-align:center}
.sysmsg{align-self:center;background:#FFF3C4;color:#54656F;font-size:11.5px;padding:5px 10px;border-radius:8px;margin:4px 0;text-align:center;max-width:90%}
.mg{display:flex;flex-direction:column;max-width:86%;gap:3px}
.mg.in{align-self:flex-start}.mg.out{align-self:flex-end;align-items:flex-end}
.bub{position:relative;background:#fff;border-radius:8px;padding:6px 8px 5px;font-size:13.8px;line-height:1.34;box-shadow:0 1px 1px rgba(0,0,0,.1);min-width:60px}
.mg.in .bub{border-top-left-radius:2px}
.mg.out .bub{background:#D9FDD3;border-top-right-radius:2px}
.bub .snd{font-weight:600;font-size:12.5px;margin-bottom:1px}
.bub .tm{float:right;margin:6px 0 -2px 10px;font-size:10.5px;color:#667781;display:flex;gap:3px;align-items:center}
.bub .tm .tk{color:#53BDEB;font-size:12px;letter-spacing:-3px}
.bub b{font-weight:700}
.bub .mono{font-family:var(--mono);font-size:13.5px;letter-spacing:.02em;background:#F0F2F5;border-radius:4px;padding:0 4px}
.wbtn{display:flex;align-items:center;justify-content:center;gap:6px;background:#fff;color:#027EB5;border-radius:8px;padding:9px 10px;font-size:13.5px;font-weight:500;box-shadow:0 1px 1px rgba(0,0,0,.1);text-align:center;min-width:100%}
.mg .btns{display:flex;flex-direction:column;gap:3px;width:100%}
.tag{display:none;font:500 10.5px var(--mono);color:#3b5b61;background:#D7EEF1;border-radius:5px;padding:2px 6px;align-self:flex-start;max-width:100%}
.mg.out .tag{align-self:flex-end}
.show-tags .tag{display:block}
.prev{margin:-2px -4px 5px;border-radius:6px;overflow:hidden;background:#F5F6F6;border-bottom:1px solid #E5E7E8}
.prev img{display:block;width:100%;height:112px;object-fit:cover}
.prev div{padding:7px 9px}
.prev b{display:block;font-size:13px;line-height:1.25}
.prev span{display:block;font-size:12px;color:#54656F;line-height:1.3;margin-top:2px}
.prev small{display:block;font-size:11px;color:#667781;margin-top:3px}
.doc{display:flex;gap:9px;align-items:center;background:#F5F6F6;border-radius:6px;padding:9px;margin:-2px -4px 5px}
.doc .pdf{width:34px;height:40px;border-radius:5px;background:#E5484D;color:#fff;font:700 10px var(--display);display:grid;place-items:center;flex:0 0 auto}
.doc b{display:block;font-size:13px;line-height:1.2;word-break:break-all}.doc span{font-size:11.5px;color:#667781}
.rcpt{margin:-2px -4px 5px;border-radius:6px;background:#fff;border:1px solid #E5E7E8;padding:10px 11px;font:11px var(--mono);color:#3c4a4e;line-height:1.5;width:196px}
.rcpt h5{margin:0 0 4px;font:700 12px var(--display);color:#0a5;display:flex;justify-content:space-between}
.rcpt hr{border:0;border-top:1px dashed #cdd5d6;margin:5px 0}
.wi{display:flex;align-items:center;gap:8px;padding:7px 8px 10px;background:#F0F2F5;color:#667781;font-size:14px}
.wi div{flex:1;background:#fff;border-radius:20px;padding:8px 14px}
.wi i{width:34px;height:34px;border-radius:50%;background:#00A884;display:grid;place-items:center;color:#fff;font-style:normal;font-size:14px}
.idle{flex:1;display:grid;place-items:center;text-align:center;padding:30px;color:#54656F;font-size:13.5px;background:#EFEAE2}
.idle div{background:#FFFFFFB8;border-radius:12px;padding:14px 16px;max-width:240px}
.picker{flex:1;background:#fff;display:flex;flex-direction:column;position:relative}
.picker .ph{background:#008069;color:#fff;padding:8px 14px 12px;font-weight:600;font-size:16px}
.picker .ph small{display:block;font-weight:400;font-size:12px;opacity:.85}
.picker .row{display:flex;align-items:center;gap:11px;padding:9px 14px;border-bottom:1px solid #F0F2F5;font-size:14.5px}
.picker .row.sel{background:#E7F5EE}
.picker .row .tkc{margin-left:auto;width:20px;height:20px;border-radius:50%;border:2px solid #C5CED1}
.picker .row.sel .tkc{background:#00A884;border-color:#00A884;color:#fff;font-size:12px;display:grid;place-items:center}
.picker .lab{padding:9px 14px 4px;font-size:12px;color:#667781;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.picker .send{position:absolute;right:14px;bottom:16px;background:#00A884;color:#fff;border-radius:22px;padding:11px 20px;font-weight:600;font-size:14px;box-shadow:0 3px 8px rgba(0,0,0,.2)}
.fresh{animation:pop .35s ease-out both}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fresh{animation:none}.wbody{scroll-behavior:auto}}

.ctl{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:center}
.nav{display:flex;gap:8px}
.nb{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 16px;font-weight:600;font-size:14px}
.nb.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.nb[disabled]{opacity:.4;cursor:default}
.cap{min-width:0}
.cap .n{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.cap .n button{width:10px;height:10px;border-radius:50%;border:0;padding:0;background:var(--line)}
.cap .n button.on{background:var(--accent);width:22px;border-radius:6px}
.cap .n span{font-size:12px;color:var(--muted);margin-left:6px}
.cap p{font-size:16px;line-height:1.4;font-weight:500}
.tog{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.sw{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;user-select:none}
.sw input{position:absolute;opacity:0}
.sw i{width:34px;height:20px;border-radius:12px;background:var(--line);position:relative;transition:background .15s;flex:0 0 auto}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.sw input:checked+i{background:var(--accent)}
.sw input:checked+i::after{transform:translateX(14px)}
.sw input:focus-visible+i{outline:3px solid var(--accent);outline-offset:2px}
.notes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:16px}
.notes .card h3{display:flex;align-items:center;gap:8px;font-size:14px;text-transform:uppercase;letter-spacing:.07em}
.notes .card h3 small{font:500 12px var(--body);text-transform:none;letter-spacing:0;color:var(--muted)}
.next-up{margin-top:22px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media (max-width:1020px){
  .stage{grid-template-columns:minmax(0,1fr)}.phone-col{position:static}
  .notes{grid-template-columns:minmax(0,1fr)}
  .ctl{grid-template-columns:minmax(0,1fr)}
}

/* ===== TravelTank site mock (fixed brand look, scaled by JS) ===== */
.tt{position:absolute;left:0;top:0;width:900px;transform-origin:0 0;background:#F1F1F1;font-family:'Roboto',Arial,sans-serif;font-size:13px;color:#2E2E2E;line-height:1.35}
.tt *{box-sizing:border-box}
.tt h2{font:500 24px 'Roboto';color:#333;letter-spacing:0}
.tt h3{font:500 18px 'Roboto';color:#333;margin:18px 0 8px;letter-spacing:0}
.tt h4{font:500 18px 'Roboto';letter-spacing:0;margin:0}
.t-hdr{background:#fff;height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 30px}
.t-hdr img{height:24px}
.t-steps{display:flex;gap:0;align-items:flex-start}
.t-st{width:98px;text-align:center;font-size:9.5px;color:#444;text-transform:uppercase;font-weight:500;position:relative;padding-top:20px}
.t-st::before{content:"";position:absolute;top:6px;left:-49px;width:98px;border-top:1px dotted #FF9D9F}
.t-st:first-child::before{display:none}
.t-st i{position:absolute;left:50%;top:0;width:13px;height:13px;margin-left:-6.5px;border-radius:50%;border:2px solid #EFB5B6;background:#fff}
.t-st.done i{background:#FE5C61;border-color:#FE5C61}
.t-st.cur i{border-color:#FE5C61;border-width:3px}
.t-st.done{color:#FE5C61}.t-st.cur{font-weight:700;color:#222}
.t-sec{font-size:12px;color:#01747F;display:flex;align-items:center;gap:6px}
.t-sec svg{width:14px;height:14px}
.t-body{display:grid;grid-template-columns:1fr 292px;gap:20px;padding:20px 30px 28px}
.t-main{min-width:0}
.t-card{background:#fff;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.t-pad{padding:14px}
.t-note{background:#F5EED6;color:#5c4d1d;font-weight:500;font-size:11.5px;padding:10px 12px;border-radius:3px}
.t-signed{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;margin:10px 0 0}
.t-signed small{display:block;font-size:10.5px;color:#666}
.t-btn{display:inline-flex;align-items:center;gap:8px;background:#FE5C61;color:#fff;font-weight:700;font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:9px 16px;border-radius:3px;border:0}
.t-btn.o{background:#fff;color:#FE5C61;border:1px solid #FE5C61}
.t-btn.sm{padding:6px 12px;font-size:10px}
.t-lab{font-size:10.5px;color:#555;margin:9px 0 3px;display:block}
.t-inp{background:#fff;border:1px solid #D9D9D9;border-radius:3px;height:32px;padding:0 10px;display:flex;align-items:center;font-size:12.5px}
.t-chips{display:flex;gap:7px}
.t-chips span{width:48px;height:30px;border:1px solid #DDD;border-radius:3px;display:grid;place-items:center;color:#999;font-size:12px}
.t-chips span.on{background:#E9F6F6;color:#222;border-color:#CBE5E7}
.t-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

function paxCard(n,v,extra){

SCN.forEach(function(s,i){s.n=i+1;});

/* ---------- Rendering ---------- */
var view=document.getElementById('view'), tabs=document.getElementById('tabs');
var state={id:'overview',step:0,tags:false,today:false};

function scrFor(s,i){
  var st=s.steps[i], o=Object.assign({},st.site||{});
  var fn=st.scr?{pay:pay,confirm:confirm}[st.scr]:s.screen;
  if(state.today){o.before=true;}
  if(s.id==='hold'||s.id==='bank'){o.plainHelp=true;}
  return fn(o);
}

function msgHTML(m,fresh,chat){
  if(m.kind==='chip') return '<div class="chip'+(fresh?' fresh':'')+'">'+m.text+'</div>';
  if(m.kind==='sys') return '<div class="sysmsg'+(fresh?' fresh':'')+'">'+m.text+'</div>';
  var out=m.from==='me', inner='';
  if(m.sender) inner+='<div class="snd" style="color:'+m.color+'">'+m.sender+'</div>';
  if(m.kind==='preview'){ var c=m.card; inner+='<div class="prev"><img src="'+c.img+'" alt=""><div><b>'+c.title+'</b><span>'+c.desc+'</span><small>'+c.dom+'</small></div></div>'; }
  if(m.kind==='rcpt'){ inner+='<div class="rcpt"><h5><span>Transfer successful</span><span>&#10003;</span></h5>To<br>TravelTank Limited<hr>Amount<br><b>'+NAIRA+'5,673,507.00</b><hr>Narration<br>TT7K2QPD<hr>Ref 0824-77310-5521</div>'; }
  if(m.doc){ inner+='<div class="doc"><div class="pdf">PDF</div><div><b>'+m.doc.name+'</b><span>'+m.doc.meta+'</span></div></div>'; }
  if(m.text) inner+=m.text;
  var tk=out?'<span class="tk">&#10003;&#10003;</span>':'';
  inner+='<span class="tm">'+(m.time||'')+tk+'</span>';
  var btns=m.btns?'<div class="btns">'+m.btns.map(function(b){return '<div class="wbtn">'+b+'</div>';}).join('')+'</div>':'';
  var tag=m.tag?'<div class="tag">'+m.tag+'</div>':'';
  return '<div class="mg '+(out?'out':'in')+(fresh?' fresh':'')+'"><div class="bub">'+inner+'</div>'+btns+tag+'</div>';
}

   '<div class="ctl"><div class="nav"><button class="nb" id="bk">&larr; Back</button><button class="nb pri" id="nx">Next &rarr;</button></div>'+
   '<div class="cap"><div class="n" id="dots"></div><p id="cap" aria-live="polite"></p></div>'+
   '<div class="tog"><label class="sw"><input type="checkbox" id="tg-today"><i></i>Show today\'s site</label><label class="sw"><input type="checkbox" id="tg-tags"><i></i>Show build tags</label></div></div>'+
   '<div class="notes">'+
    noteCard('For design','layout and states',s.notes.design)+noteCard('For the business','value and measures',s.notes.biz)+noteCard('For the build','what it takes',s.notes.build)+'</div>'+
   '<div class="next-up">'+(prev?'<button class="nb" data-go="'+prev.id+'">&larr; '+prev.n+'. '+prev.title+'</button>':'<button class="nb" data-go="overview">&larr; Overview</button>')+(next?'<button class="nb pri" data-go="'+next.id+'">'+next.n+'. '+next.title+' &rarr;</button>':'<button class="nb pri" data-go="overview">Back to overview</button>')+'</div></section>';
}
function noteCard(t,sm,arr){return '<div class="card"><h3>'+t+' <small>'+sm+'</small></h3><ul>'+arr.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul></div>';}

function fit(){
  var vp=document.getElementById('vp'), tt=document.getElementById('tt'); if(!vp||!tt) return;
  var sc=vp.clientWidth/900; tt.style.transform='scale('+sc+')'; vp.style.height=Math.ceil(tt.offsetHeight*sc)+'px';
}
function draw(){
  var s=SCN.filter(function(x){return x.id===state.id;})[0]; if(!s) return;
  var i=state.step, st=s.steps[i];
  var tt=document.getElementById('tt'); tt.innerHTML=scrFor(s,i);
  document.getElementById('ph').innerHTML=phoneHTML(s,i);
  document.getElementById('pcol').classList.toggle('show-tags',state.tags);
  document.getElementById('cap').textContent=st.cap;
  document.getElementById('dots').innerHTML=s.steps.map(function(_,k){return '<button class="'+(k===i?'on':'')+'" aria-label="Step '+(k+1)+'" data-step="'+k+'"></button>';}).join('')+'<span>Step '+(i+1)+' of '+s.steps.length+'</span>';
  document.getElementById('bk').disabled=(i===0);
  document.getElementById('nx').disabled=(i===s.steps.length-1);
  var wb=document.getElementById('wbody'); if(wb){wb.scrollTop=wb.scrollHeight;}
  tt.classList.toggle('noanim',state.today);
  fit();
}
function overview(){
  var stages=[
   ['Discover and search',[1,2,3],''],
   ['Traveller info',[4,5],''],
   ['Extras',[],'Protocol and baggage offers, asked in chat (see 8 and 9)'],
   ['Payment',[6,7],''],
   ['Confirmation',[8],''],
   ['Before the trip',[9],''],
   ['After booking',[10],'']
  ];
  var jm=stages.map(function(st){
    var tp=st[1].map(function(n){var s=SCN[n-1];return '<button data-go="'+s.id+'"><b>'+n+'</b><span>'+s.title+'</span></button>';}).join('');
    if(st[2]) tp+='<div class="later"><em>Also</em>'+st[2]+'</div>';
    return '<div class="jm-st"><h4>'+st[0]+'</h4><div class="jm-line"><i></i></div><div class="jm-tp">'+tp+'</div></div>';}).join('');
  var obs=[
   ['The homepage promises Sharks 24/7 and a refund tracker','Homepage cards','home'],
   ['Hotel and flight pages offer help as a phone number only','Need help? panel','hotel'],
   ['Track price and Share are buttons, and the site promises to notify you of price changes','Flight details','track'],
   ['The SMS option costs '+NAIRA+'3,000 at checkout','Traveller info page','opt-in'],
   ['Names must match ID, and the booker types them for everyone','Traveller info page','travellers'],
   ['Holds are released in 72 hours if no payment is received','Payment page','hold'],
   ['Bank transfer details go on screen and by email only','Payment page','bank'],
   ['Fares can be non-refundable, and Cancel is one button','Confirmation page','refund']
  ].map(function(o){return '<div class="ob"><q>'+o[1]+'</q><strong>'+o[0]+'</strong><button data-go="'+o[2]+'">See the idea &rarr;</button></div>';}).join('');
  var eff=[
   ['1. Homepage chat, refunds, deals','Cheap first contact, fewer repeat refund calls','wa.me links, auto-reply menu, case lookup, Channel','m','Chats started, resolved without an agent'],
   ['2. Ask a Shark with context','Answers at the moment of doubt','Prefilled link, agent inbox','l','Conversion of chat against non-chat sessions'],
   ['3. Track price and share','Return visits and new visitors','Alert subscriptions, marketing templates, share links','m','Alert-to-booking rate, shares per fare'],
   ['4. Opt in at checkout','Consented contact for everything else','Cloud API, consent log, first template','m','Opt-in rate'],
   ['5. Traveller details by link','Faster group bookings, fewer name errors','Tokenised link, WhatsApp Flow','m','Completion by link'],
   ['6. Hold reminders','Holds that turn into payments','Templates, scheduler, payment links','m','Hold-to-paid rate'],
   ['7. Bank transfer and receipts','Faster, calmer confirmation','Media handling, agent inbox, finance event','h','Receipt-to-confirmed time'],
   ['8. Tickets and a Shark','Fewer calls, more extras sold','Document template, inbox, handoff rules','h','Calls per booking, extras attach'],
   ['9. Pre-trip care','Trust and add-on sales','Triggers, preference store, marketing consent','h','Opt-out rate, add-on attach'],
   ['10. Cancel and refund tracker','Fewer repeat contacts','Case management, status events','h','Contacts per refund case']
  ];
  var lvl={l:'Low',m:'Medium',h:'Higher'};
  var rows=eff.map(function(r){return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td><td><span class="lv '+r[3]+'">'+lvl[r[3]]+'</span></td><td>'+r[4]+'</td></tr>';}).join('');
  return '<div class="hero"><div class="kicker">Concept prototype</div><h1>WhatsApp, woven into the TravelTank booking journey</h1>'+
   '<p>Ten touchpoints, designed on the real site from homepage to refund. Each one pairs a TravelTank screen with the WhatsApp conversation it triggers, and can be stepped through. Use the toggles to see today\'s site, or the build tags.</p></div>'+
   '<div class="sec"><h2>What the current site tells us</h2><p class="sub">Each touchpoint starts from something the site already does or promises.</p><div class="obs">'+obs+'</div></div>'+
   '<div class="sec"><h2>The journey</h2><p class="sub">Numbers follow the customer\'s order. Select one to open it.</p><div class="jm"><div class="jm-grid">'+jm+'</div></div></div>'+
   '<div class="sec"><h2>At a glance</h2><p class="sub">Effort is indicative and needs to be confirmed with the tech partner.</p><div class="tbl"><table><thead><tr><th>Touchpoint</th><th>What it buys</th><th>What it needs</th><th>Effort</th><th>Measure</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'+
   '<div class="sec"><div class="two"><div class="card"><h3>Ground rules</h3><ul><li>Opt-in is explicit and unticked. Marketing consent is separate from service messages.</li><li>WhatsApp carries the conversation. Card payments stay on the site or a hosted payment page.</li><li>A Shark is always one tap away, and the booking is attached.</li><li>Every message can be stopped by replying STOP, and from My Account.</li><li>Messages outside the 24-hour window use approved templates only.</li></ul></div>'+
   '<div class="card"><h3>Decisions for the owner</h3><ul><li>SMS at '+NAIRA+'3,000: keep, reprice or retire.</li><li>One dedicated WhatsApp number for TravelTank, or reuse the 24/7 line.</li><li>Staffing and hours for the WhatsApp inbox, and out-of-hours wording.</li><li>Which Business Solution Provider, and who owns the template library.</li><li>Data protection review of consent wording and retention.</li></ul></div>'+
   '<div class="card"><h3>Later phases</h3><ul><li>Visa concierge: checklist, document uploads and status.</li><li>Holiday enquiries in chat, with the itinerary as a PDF.</li><li>WhatsApp code at sign-in, using the mobile number already collected.</li><li>Click-to-WhatsApp from Instagram and Facebook posts and ads.</li><li>Post-trip review and rebooking.</li></ul></div></div></div>'+
   '<p class="fine">All screens are illustrative concepts built from the current TravelTank site. Names, numbers, prices, times and service promises are examples. WhatsApp message categories, pricing and policies change and must be confirmed with Meta or the chosen provider before launch. WhatsApp is a trademark of Meta and this prototype is not affiliated with it.</p>';
}

function render(){
  var s=SCN.filter(function(x){return x.id===state.id;})[0];
  Array.prototype.forEach.call(tabs.children,function(b){b.setAttribute('aria-current',String(b.dataset.go===state.id));});
  if(!s){ view.innerHTML=overview(); return; }
  view.innerHTML=scenarioHTML(s);
  document.getElementById('tg-tags').checked=state.tags; document.getElementById('tg-today').checked=state.today;
  draw();
}
function go(id,step){
  state.id=id; state.step=step||0;
  try{ history.replaceState(null,'','#'+id); }catch(e){ try{location.hash=id;}catch(_){} }
  render(); window.scrollTo(0,0);
}
tabs.innerHTML='<button class="tab" data-go="overview">Overview</button>'+SCN.map(function(s){
  var short={'home':'Homepage','hotel':'Ask a Shark','track':'Track and share','opt-in':'Opt in','travellers':'Traveller details','hold':'Hold reminders','bank':'Bank transfer','confirm':'Tickets and a Shark','pretrip':'Pre-trip care','refund':'Cancel and refund'}[s.id];
  return '<button class="tab" data-go="'+s.id+'"><b>'+s.n+'</b>'+short+'</button>';}).join('');
document.addEventListener('click',function(e){
  var g=e.target.closest('[data-go]'); if(g){go(g.dataset.go);return;}
  var d=e.target.closest('[data-step]'); if(d){state.step=+d.dataset.step;draw();return;}
  if(e.target.id==='nx'){var s=SCN.filter(function(x){return x.id===state.id;})[0]; if(state.step<s.steps.length-1){state.step++;draw();}}
  if(e.target.id==='bk'){ if(state.step>0){state.step--;draw();}}
});
document.addEventListener('change',function(e){
  if(e.target.id==='tg-tags'){state.tags=e.target.checked;draw();}
  if(e.target.id==='tg-today'){state.today=e.target.checked;draw();}
});
document.addEventListener('keydown',function(e){
  if(/INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  var s=SCN.filter(function(x){return x.id===state.id;})[0]; if(!s) return;
  if(e.key==='ArrowRight'&&state.step<s.steps.length-1){state.step++;draw();}
  if(e.key==='ArrowLeft'&&state.step>0){state.step--;draw();}
});
window.addEventListener('resize',fit);
if(window.ResizeObserver){ new ResizeObserver(fit).observe(document.body); }
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(fit);}
var h=(location.hash||'').replace('#','');
if(h&&(h==='overview'||SCN.some(function(x){return x.id===h;}))) state.id=h;
render();
})();
</script>
