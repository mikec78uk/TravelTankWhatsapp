<title>TravelTank on WhatsApp</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap">
<style>
/* Layout concept: a review deck for three audiences. Each touchpoint pairs the real TravelTank screen (left, scaled)
   with a WhatsApp phone (right), driven by one stepper, with design / business / build notes beneath. */
:root{
  --bg:#F2F6F6; --surface:#FFFFFF; --surface-2:#E9F3F3; --ink:#0F2A2E; --muted:#4D666A; --line:#D5E2E3;
  --accent:#01747F; --accent-ink:#FFFFFF; --coral:#FE5C61; --wa:#168F4D; --wa-soft:#E2F5E9; --wa-line:#9BD9B3;
  --pos:#01747F; --neg:#C73B41; --display:'Manrope','Roboto',system-ui,sans-serif; --body:'Roboto',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'Roboto Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1315; --surface:#111E21; --surface-2:#172A2E; --ink:#E5F0F1; --muted:#98B1B4; --line:#233a3f;
  --accent:#4DC4D0; --accent-ink:#06282C; --coral:#FF7A7E; --wa:#3FD17F; --wa-soft:#123325; --wa-line:#21603F; --pos:#4DC4D0; --neg:#FF8A8E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1315; --surface:#111E21; --surface-2:#172A2E; --ink:#E5F0F1; --muted:#98B1B4; --line:#233a3f;
  --accent:#4DC4D0; --accent-ink:#06282C; --coral:#FF7A7E; --wa:#3FD17F; --wa-soft:#123325; --wa-line:#21603F; --pos:#4DC4D0; --neg:#FF8A8E; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
.wrap{max-width:1240px;margin:0 auto}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.logo{height:26px;width:auto}.logo-w{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo-g{display:none}:root:not([data-theme="light"]) .logo-w{display:block}}
:root[data-theme="dark"] .logo-g{display:none}:root[data-theme="dark"] .logo-w{display:block}

/* top bar + tabs */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:18px 10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px}
.brand .x{width:1px;height:22px;background:var(--line)}
.brand .wa-name{display:flex;align-items:center;gap:7px;font-family:var(--display);font-weight:700;font-size:16px}
.brand .wa-name svg{width:20px;height:20px;color:var(--wa)}
.status{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:var(--surface)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:6px 0 14px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;scrollbar-width:thin}
.tab{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:500;color:var(--muted)}
.tab b{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--surface-2);color:var(--ink);font:700 11px var(--display)}
.tab[aria-current="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tab[aria-current="true"] b{background:rgba(255,255,255,.22);color:var(--accent-ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tab[aria-current="true"] b{background:rgba(0,0,0,.18)}}
:root[data-theme="dark"] .tab[aria-current="true"] b{background:rgba(0,0,0,.18)}

/* overview */
.hero{padding:18px 0 8px;max-width:820px}
.hero h1{font-size:clamp(28px,4.2vw,44px);line-height:1.08;font-weight:800}
.hero p{margin-top:14px;font-size:17px;color:var(--muted);max-width:66ch}
.sec{margin-top:40px}
.sec>h2{font-size:22px;font-weight:800}
.sec>.sub{color:var(--muted);margin-top:4px;max-width:70ch}
.obs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:16px}
.ob{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.ob q{font-family:var(--mono);font-size:12px;color:var(--muted);quotes:none;background:var(--surface-2);padding:6px 8px;border-radius:6px}
.ob strong{font-weight:700;font-size:15px}
.ob button{align-self:flex-start;margin-top:auto;background:none;border:0;padding:0;color:var(--accent);font-weight:600;font-size:13px;text-decoration:underline;text-underline-offset:3px}
.jm{margin-top:16px;overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 8px 20px}
.jm-grid{display:grid;grid-template-columns:repeat(7,minmax(128px,1fr));min-width:920px}
.jm-st{padding:0 10px;text-align:center}
.jm-st h4{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;height:32px;display:flex;align-items:flex-start;justify-content:center}
.jm-line{position:relative;height:30px;margin:2px 0 12px}
.jm-line::before{content:"";position:absolute;left:0;right:0;top:14px;border-top:2px dashed var(--line)}
.jm-line i{position:absolute;left:50%;top:7px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--surface);border:3px solid var(--accent)}
.jm-tp{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.jm-tp button{display:flex;gap:8px;align-items:flex-start;text-align:left;border:1px solid var(--wa-line);background:var(--wa-soft);border-radius:10px;padding:8px 9px;font-size:12.5px;line-height:1.3}
.jm-tp button b{flex:0 0 auto;display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--wa);color:#fff;font:700 12px var(--display)}
.jm-tp .later{border:1px dashed var(--line);background:transparent;border-radius:10px;padding:8px 9px;font-size:12.5px;line-height:1.3;color:var(--muted);text-align:left}
.jm-tp .later em{display:block;font-style:normal;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;margin-bottom:2px}
.tbl{margin-top:16px;overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:13.5px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td:first-child{font-weight:600}
.lv{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;border:1px solid var(--line)}
.lv.l{background:var(--wa-soft);border-color:var(--wa-line)}.lv.m{background:var(--surface-2)}.lv.h{border-color:var(--coral)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.card h3{font-size:16px;font-weight:800;margin-bottom:8px}
.card ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.card li::marker{color:var(--accent)}
.fine{margin-top:34px;font-size:12.5px;color:var(--muted);max-width:90ch}

/* scenario */
.scn-head{padding:14px 0 18px;max-width:860px}
.kicker{font-size:12px;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--accent)}
.scn-head h2{font-size:clamp(24px,3.4vw,34px);line-height:1.1;font-weight:800;margin-top:6px}
.scn-head .lede{margin-top:10px;font-size:16.5px;color:var(--muted)}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 352px;gap:28px;align-items:start}
.frame-bar{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.pill{font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 10px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.pill.ex{border-color:var(--wa-line);background:var(--wa-soft);color:var(--wa)}
.pill.nw{border-color:var(--coral);color:var(--coral)}
.browser{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 10px 30px rgba(8,40,44,.10)}
.b-bar{display:flex;align-items:center;gap:6px;padding:9px 12px;background:#E9EEEF;border-bottom:1px solid #D5DDDE}
.b-bar i{width:10px;height:10px;border-radius:50%;background:#C3CDCF}
.b-bar .url{flex:1;margin-left:10px;background:#fff;border-radius:6px;padding:3px 10px;font:12px var(--mono);color:#51666A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.viewport{position:relative;overflow:hidden;background:#F1F1F1}
.phone-col{position:sticky;top:64px}
.phone{width:340px;max-width:100%;margin:0 auto;border-radius:44px;background:#14191B;padding:11px;box-shadow:0 18px 40px rgba(8,40,44,.28)}
.scr{position:relative;border-radius:34px;overflow:hidden;background:#EFEAE2;height:640px;display:flex;flex-direction:column;font-family:var(--body);color:#111B21}
.st{display:flex;justify-content:space-between;padding:10px 24px 4px;font:600 12px var(--body);background:#008069;color:#fff}
.wh{display:flex;align-items:center;gap:9px;padding:6px 12px 9px;background:#008069;color:#fff}
.wh .back{font-size:20px;line-height:1}
.av{width:36px;height:36px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:0 0 auto;font:800 13px var(--display);color:#01747F}
.av.g{background:#D0DDDF;color:#34484C}
.wh .nm{font-weight:600;font-size:15.5px;line-height:1.15;display:flex;align-items:center;gap:5px}
.wh .nm svg{width:14px;height:14px}
.wh .sb{font-size:11.5px;opacity:.85;line-height:1.2}
.wh .ic{margin-left:auto;display:flex;gap:16px;opacity:.9;font-size:15px}
.wbody{flex:1;overflow-y:auto;padding:10px 10px 14px;display:flex;flex-direction:column;gap:5px;scroll-behavior:smooth;
  background-color:#EFEAE2;background-image:radial-gradient(rgba(0,0,0,.035) 1px,transparent 1.2px);background-size:14px 14px}
.wbody::-webkit-scrollbar{width:0}
.chip{align-self:center;background:#FFFFFFD9;color:#54656F;font-size:11.5px;padding:4px 10px;border-radius:8px;margin:5px 0;box-shadow:0 1px 1px rgba(0,0,0,.06);text-align:center}
.sysmsg{align-self:center;background:#FFF3C4;color:#54656F;font-size:11.5px;padding:5px 10px;border-radius:8px;margin:4px 0;text-align:center;max-width:90%}
.mg{display:flex;flex-direction:column;max-width:86%;gap:3px}
.mg.in{align-self:flex-start}.mg.out{align-self:flex-end;align-items:flex-end}
.bub{position:relative;background:#fff;border-radius:8px;padding:6px 8px 5px;font-size:13.8px;line-height:1.34;box-shadow:0 1px 1px rgba(0,0,0,.1);min-width:60px}
.mg.in .bub{border-top-left-radius:2px}
.mg.out .bub{background:#D9FDD3;border-top-right-radius:2px}
.bub .snd{font-weight:600;font-size:12.5px;margin-bottom:1px}
.bub .tm{float:right;margin:6px 0 -2px 10px;font-size:10.5px;color:#667781;display:flex;gap:3px;align-items:center}
.bub .tm .tk{color:#53BDEB;font-size:12px;letter-spacing:-3px}
.bub b{font-weight:700}
.bub .mono{font-family:var(--mono);font-size:13.5px;letter-spacing:.02em;background:#F0F2F5;border-radius:4px;padding:0 4px}
.wbtn{display:flex;align-items:center;justify-content:center;gap:6px;background:#fff;color:#027EB5;border-radius:8px;padding:9px 10px;font-size:13.5px;font-weight:500;box-shadow:0 1px 1px rgba(0,0,0,.1);text-align:center;min-width:100%}
.mg .btns{display:flex;flex-direction:column;gap:3px;width:100%}
.tag{display:none;font:500 10.5px var(--mono);color:#3b5b61;background:#D7EEF1;border-radius:5px;padding:2px 6px;align-self:flex-start;max-width:100%}
.mg.out .tag{align-self:flex-end}
.show-tags .tag{display:block}
.prev{margin:-2px -4px 5px;border-radius:6px;overflow:hidden;background:#F5F6F6;border-bottom:1px solid #E5E7E8}
.prev img{display:block;width:100%;height:112px;object-fit:cover}
.prev div{padding:7px 9px}
.prev b{display:block;font-size:13px;line-height:1.25}
.prev span{display:block;font-size:12px;color:#54656F;line-height:1.3;margin-top:2px}
.prev small{display:block;font-size:11px;color:#667781;margin-top:3px}
.doc{display:flex;gap:9px;align-items:center;background:#F5F6F6;border-radius:6px;padding:9px;margin:-2px -4px 5px}
.doc .pdf{width:34px;height:40px;border-radius:5px;background:#E5484D;color:#fff;font:700 10px var(--display);display:grid;place-items:center;flex:0 0 auto}
.doc b{display:block;font-size:13px;line-height:1.2;word-break:break-all}.doc span{font-size:11.5px;color:#667781}
.rcpt{margin:-2px -4px 5px;border-radius:6px;background:#fff;border:1px solid #E5E7E8;padding:10px 11px;font:11px var(--mono);color:#3c4a4e;line-height:1.5;width:196px}
.rcpt h5{margin:0 0 4px;font:700 12px var(--display);color:#0a5;display:flex;justify-content:space-between}
.rcpt hr{border:0;border-top:1px dashed #cdd5d6;margin:5px 0}
.wi{display:flex;align-items:center;gap:8px;padding:7px 8px 10px;background:#F0F2F5;color:#667781;font-size:14px}
.wi div{flex:1;background:#fff;border-radius:20px;padding:8px 14px}
.wi i{width:34px;height:34px;border-radius:50%;background:#00A884;display:grid;place-items:center;color:#fff;font-style:normal;font-size:14px}
.idle{flex:1;display:grid;place-items:center;text-align:center;padding:30px;color:#54656F;font-size:13.5px;background:#EFEAE2}
.idle div{background:#FFFFFFB8;border-radius:12px;padding:14px 16px;max-width:240px}
.picker{flex:1;background:#fff;display:flex;flex-direction:column;position:relative}
.picker .ph{background:#008069;color:#fff;padding:8px 14px 12px;font-weight:600;font-size:16px}
.picker .ph small{display:block;font-weight:400;font-size:12px;opacity:.85}
.picker .row{display:flex;align-items:center;gap:11px;padding:9px 14px;border-bottom:1px solid #F0F2F5;font-size:14.5px}
.picker .row.sel{background:#E7F5EE}
.picker .row .tkc{margin-left:auto;width:20px;height:20px;border-radius:50%;border:2px solid #C5CED1}
.picker .row.sel .tkc{background:#00A884;border-color:#00A884;color:#fff;font-size:12px;display:grid;place-items:center}
.picker .lab{padding:9px 14px 4px;font-size:12px;color:#667781;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.picker .send{position:absolute;right:14px;bottom:16px;background:#00A884;color:#fff;border-radius:22px;padding:11px 20px;font-weight:600;font-size:14px;box-shadow:0 3px 8px rgba(0,0,0,.2)}
.fresh{animation:pop .35s ease-out both}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fresh{animation:none}.wbody{scroll-behavior:auto}}

.ctl{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:center}
.nav{display:flex;gap:8px}
.nb{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 16px;font-weight:600;font-size:14px}
.nb.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.nb[disabled]{opacity:.4;cursor:default}
.paths{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin:0 0 16px}
.paths .seg{display:inline-flex;gap:4px;padding:4px;border:1px solid var(--line);background:var(--surface);border-radius:12px}
.paths .seg button{border:0;background:transparent;border-radius:9px;padding:8px 14px;font-weight:600;font-size:14px;color:var(--muted)}
.paths .seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.paths small{font-size:12.5px;color:var(--muted)}
.cap{min-width:0}
.cap .n{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.cap .n button{width:10px;height:10px;border-radius:50%;border:0;padding:0;background:var(--line)}
.cap .n button.on{background:var(--accent);width:22px;border-radius:6px}
.cap .n span{font-size:12px;color:var(--muted);margin-left:6px}
.cap p{font-size:16px;line-height:1.4;font-weight:500}
.tog{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.sw{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;user-select:none}
.sw input{position:absolute;opacity:0}
.sw i{width:34px;height:20px;border-radius:12px;background:var(--line);position:relative;transition:background .15s;flex:0 0 auto}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.sw input:checked+i{background:var(--accent)}
.sw input:checked+i::after{transform:translateX(14px)}
.sw input:focus-visible+i{outline:3px solid var(--accent);outline-offset:2px}
.notes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:16px}
.notes .card h3{display:flex;align-items:center;gap:8px;font-size:14px;text-transform:uppercase;letter-spacing:.07em}
.notes .card h3 small{font:500 12px var(--body);text-transform:none;letter-spacing:0;color:var(--muted)}
.next-up{margin-top:22px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media (max-width:1020px){
  .stage{grid-template-columns:minmax(0,1fr)}.phone-col{position:static}
  .notes{grid-template-columns:minmax(0,1fr)}
  .ctl{grid-template-columns:minmax(0,1fr)}
}

/* ===== TravelTank site mock (fixed brand look, scaled by JS) ===== */
.tt{position:absolute;left:0;top:0;width:900px;transform-origin:0 0;background:#F1F1F1;font-family:'Roboto',Arial,sans-serif;font-size:13px;color:#2E2E2E;line-height:1.35}
.tt *{box-sizing:border-box}
.tt h2{font:500 24px 'Roboto';color:#333;letter-spacing:0}
.tt h3{font:500 18px 'Roboto';color:#333;margin:18px 0 8px;letter-spacing:0}
.tt h4{font:500 18px 'Roboto';letter-spacing:0;margin:0}
.t-hdr{background:#fff;height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 30px}
.t-hdr img{height:24px}
.t-steps{display:flex;gap:0;align-items:flex-start}
.t-st{width:98px;text-align:center;font-size:9.5px;color:#444;text-transform:uppercase;font-weight:500;position:relative;padding-top:20px}
.t-st::before{content:"";position:absolute;top:6px;left:-49px;width:98px;border-top:1px dotted #FF9D9F}
.t-st:first-child::before{display:none}
.t-st i{position:absolute;left:50%;top:0;width:13px;height:13px;margin-left:-6.5px;border-radius:50%;border:2px solid #EFB5B6;background:#fff}
.t-st.done i{background:#FE5C61;border-color:#FE5C61}
.t-st.cur i{border-color:#FE5C61;border-width:3px}
.t-st.done{color:#FE5C61}.t-st.cur{font-weight:700;color:#222}
.t-sec{font-size:12px;color:#01747F;display:flex;align-items:center;gap:6px}
.t-sec svg{width:14px;height:14px}
.t-body{display:grid;grid-template-columns:1fr 292px;gap:20px;padding:20px 30px 28px}
.t-main{min-width:0}
.t-card{background:#fff;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.t-pad{padding:14px}
.t-note{background:#F5EED6;color:#5c4d1d;font-weight:500;font-size:11.5px;padding:10px 12px;border-radius:3px}
.t-signed{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;margin:10px 0 0}
.t-signed small{display:block;font-size:10.5px;color:#666}
.t-btn{display:inline-flex;align-items:center;gap:8px;background:#FE5C61;color:#fff;font-weight:700;font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:9px 16px;border-radius:3px;border:0}
.t-btn.o{background:#fff;color:#FE5C61;border:1px solid #FE5C61}
.t-btn.sm{padding:6px 12px;font-size:10px}
.t-lab{font-size:10.5px;color:#555;margin:9px 0 3px;display:block}

.cs-t{flex:0 0 auto;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:var(--muted);background:var(--surface-2)}
.cs-row{display:grid;grid-template-columns:minmax(0,1fr) 132px;gap:12px;align-items:center;margin-top:6px}
.cs-row input[type=range]{width:100%;accent-color:var(--accent);min-width:0}
.cs-num{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:8px;padding:0 8px;background:var(--bg);height:34px}
.cs-num input{width:100%;min-width:0;border:0;background:transparent;color:var(--ink);font:600 14px var(--body);text-align:right;font-variant-numeric:tabular-nums;outline:0}
.cs-num:focus-within{outline:3px solid var(--accent);outline-offset:1px}
.cs-num span{color:var(--muted);font-size:12px}
.cs-res{position:relative;min-width:0}
.cs-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.cs-card h3{font-size:16px;font-weight:800}
.cs-card .sub{color:var(--muted);font-size:13px;margin-top:2px}
.cs-bars{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.cs-bar{display:grid;grid-template-columns:150px minmax(0,1fr) 78px;gap:10px;align-items:center;font-size:13px;padding:2px 0}
.cs-bar .tr{height:12px;position:relative}
.cs-bar .fl{position:absolute;top:0;bottom:0;border-radius:0 4px 4px 0;background:var(--pos)}
.cs-bar.neg .fl{background:var(--neg)}
.cs-bar .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.cs-bar.tot{border-top:1px solid var(--line);margin-top:4px;padding-top:8px;font-weight:700}
.cs-svg{width:100%;height:auto;display:block;overflow:visible}
.cs-svg text{font:11px var(--body);fill:var(--muted)}
.cs-svg .g{stroke:var(--line);stroke-width:1}
.cs-svg .z{stroke:var(--ink);stroke-width:1;opacity:.55}
.cs-svg .ln{fill:none;stroke:var(--pos);stroke-width:2;stroke-linejoin:round}
.cs-svg .ar{fill:var(--pos);opacity:.08}
.cs-svg .pb{fill:var(--pos);stroke:var(--surface);stroke-width:2}
.cs-svg .lbl{fill:var(--ink);font-weight:600}
.cs-svg .pos{fill:var(--pos)}.cs-svg .neg{fill:var(--neg)}
.cs-svg .hv{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.cs-leg{display:flex;gap:16px;font-size:12.5px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.cs-leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.cs-tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:8px;padding:6px 10px;font-size:12.5px;line-height:1.35;z-index:6;white-space:nowrap;transform:translate(-50%,-110%);box-shadow:0 4px 14px rgba(0,0,0,.25)}
.cs-res details{margin-top:4px}.cs-res summary{cursor:pointer;font-weight:600;font-size:14px;padding:6px 0}
.cs-res table{min-width:0;font-size:13px}
.cs-res td:last-child,.cs-res th:last-child{text-align:right;font-variant-numeric:tabular-nums}
.cs-firm ul{margin:8px 0 0;padding-left:18px;font-size:13.5px;display:flex;flex-direction:column;gap:6px}
.cs-firm b{font-weight:700}
@media (max-width:1020px){
  .cs-main{grid-template-columns:minmax(0,1fr)}
  .cs-kpis{grid-template-columns:repeat(2,minmax(0,1fr));position:static}
  .cs-bar{grid-template-columns:110px minmax(0,1fr) 70px}
}

.new{outline:2px dashed #1DA85A;outline-offset:3px;border-radius:5px}
.new::after{content:"NEW";position:absolute;top:-10px;right:10px;background:#1DA85A;color:#fff;font:700 8.5px/1 'Roboto';padding:3px 6px;border-radius:3px;letter-spacing:.07em}
.t-help .wab.new::after{top:-9px}
.chg{outline:2px dashed #E39A00;outline-offset:3px;border-radius:5px;position:relative}
.chg::after{content:"CHANGED";position:absolute;top:-10px;right:10px;background:#E39A00;color:#fff;font:700 8.5px/1 'Roboto';padding:3px 6px;border-radius:3px;letter-spacing:.07em}
.noanim .new,.noanim .chg{outline:0}.noanim .new::after,.noanim .chg::after{display:none}
</style>

  B(4,'text',{text:T('Good choice. I\'ve re-checked the fare just now:\n\n*Lagos ⇄ London*\nFri 21 Aug to Mon 21 Sep\nBritish Airways, direct, 2 adults\n*'+NAIRA+'5,673,507* in total\n\nNext, add who is travelling. You can hold the fare for 72 hours without paying. Prices are not guaranteed until booked.'),btns:['↗ Add traveller details'],time:'14:01',tag:'Session message · one link button · the URL carries a fare key, party size, source and a one-time token'}),

 notes:{
  design:['The entry sits in the hero beside the search, where someone who does not know where to go gets stuck. Search is untouched.','Three questions, one tap each, so ideas arrive in about a minute with no typing. A Shark is always one tap away.','Cards lead with the place and the price for two, return, so people compare like with like. Two images here are placeholders, and photography and tone are for the visual designer.','The link lands on traveller details with a banner saying where the trip came from and a Change trip link, so nobody feels locked in.'],
  biz:['Today the site serves people who already know where they are going. This reaches the undecided, who currently leave or ask a friend.','It skips search and results. One WhatsApp tap lands on traveller details, the step where intent is highest.','Ideas should be fares TravelTank can sell, so every card is a real booking path. Ranking by price, margin, seat availability or editorial is a business decision.','Entry rules matter for Nigerian passports on many routes. Each card should show the visa position before the price excites, which is also a natural hand-off to the later visa concierge.','Measure chats started from the line, ideas viewed, card taps, link taps, traveller page reached, hold or paid, and weekly-ideas opt-ins.'],
  build:['The entry is a wa.me link with prefilled text and a source tag. The same link works from the homepage, Channel posts and social ads.','Ideas come from a live fare search on the mood, party size and dates, limited to destinations TravelTank sells. The mood-to-destination list is maintained by people, not generated.','Cards may be a carousel or three separate messages. Confirm what the provider and current API allow inside a session, and which category applies. [confirm]','The link carries a fare or itinerary key, party size, source tag and a short-lived one-time token. No names, phone numbers or other personal data go in the URL.','On open, the site re-prices the fare. If it changed, show the new price first. If it is gone, offer the nearest alternative and keep the trip in context.','The site knows the chat number, so the contact step can offer WhatsApp updates for it, still unticked. Starting a chat is not consent to booking updates after the 24-hour window.','The follow-up is one message, only if no booking has started, and never after a reply. Outside the window, only opted-in people and approved templates.']},
 talk:{
  steps:[
   {cap:'Same entry button and prefilled message. This time the assistant invites a request in the customer\'s own words, and keeps the quick questions one tap away.',site:{},ph:{view:'chat'}},
   {cap:'Tunde types it the way he would say it. The assistant picks out mood, party size, dates and budget, and says back what it understood before it searches.',site:{},ph:{view:'chat'}},
   {cap:'One tap to confirm. Ideas arrive as before, within budget. From here it continues as on the other path: Plan this trip, then the link to traveller details.',site:{},ph:{view:'chat'}},
   {cap:'Then he types something the assistant cannot pin down. It does not guess. It says so, asks one specific question, and offers a way out.',site:{},ph:{view:'chat'}},
   {cap:'A second unclear reply ends the guessing. The assistant hands over and offers a chat or a call. Asking for a person at any point skips straight to this.',site:{},ph:{view:'chat'}},
   {cap:'Call me back opens a short form inside the chat. The number is prefilled from WhatsApp, and he picks when.',site:{},ph:{view:'callback'}},
   {cap:'A Travel Shark joins the same thread with the history and the understood request in front of them. Nothing is repeated.',site:{},ph:{view:'chat'}}
  ],
  msgs:[
   B(0,'chip',{text:'Today'}),
   B(0,'text',{from:'me',text:'Hi TravelTank, I\'d like trip ideas from Lagos ✨',time:'13:58',tag:'Prefilled by the homepage button · opens the 24h window · no template needed'}),
   B(0,'text',{text:T('Hi 👋 Tell me what you have in mind, in your own words. Where you\'d like to go, who is coming, roughly when, and a budget if you have one.\n\nOr use the quick questions.'),btns:['↩ Quick questions','↩ Talk to a Shark'],time:'13:58',tag:'Session message · free text invited · a person and the buttons are always offered'}),
   B(1,'text',{from:'me',text:'Somewhere with great food and culture for me and my wife. Late August for about a month, budget around 3m each',time:'13:59',tag:'Free text · the assistant extracts mood, party size, dates and budget'}),
   B(1,'text',{text:T('Let me check I\'ve got this right:\n\n• Mood: *city and food*\n• Travellers: *2 adults*\n• Dates: *late August*, about a month\n• Budget: up to *'+NAIRA+'3,000,000* each ('+NAIRA+'6,000,000 for two)\n\nShall I search?'),btns:['↩ Yes, show ideas','↩ Change something','↩ Talk to a Shark'],time:'13:59',tag:'Confirm-back · nothing is searched until the customer agrees · each button 20 characters or fewer'}),
   B(2,'text',{from:'me',text:'Yes, show ideas',time:'14:00',tag:'Button reply'}),
   B(2,'text',{text:T('Three ideas within your budget, leaving around *21 Aug* for about a month. These are the lowest fares we found today. ✈️'),time:'14:00',tag:'Session message · built from a live fare search, not from the assistant\'s own wording'}),
   B(2,'carousel',{cards:[
    {img:LONDON,title:'London',desc:'Return for 2 · 21 Aug to 21 Sep · direct',price:'from '+NAIRA+'5,673,507',btn:'Plan this trip'},
    {img:tile('#8A3B5E','#E58C9E','Istanbul'),title:'Istanbul',desc:'Return for 2 · 21 Aug to 21 Sep',price:'from '+NAIRA+'1,741,886',btn:'Plan this trip'},
    {img:tile('#0B7D84','#6FC2C6','Dubai'),title:'Dubai',desc:'Return for 2 · 21 Aug to 21 Sep',price:'from '+NAIRA+'1,504,120',btn:'Plan this trip'}
   ],tag:'Same cards as the tap path · fares not guaranteed until booked'}),
   B(3,'text',{from:'me',text:'Actually something like what my brother did last year, you know the one',time:'14:02',tag:'Free text · no mood, place, date or budget can be read from it'}),
   B(3,'text',{text:T('Sorry, I\'m not sure I\'ve understood. Could you give me a place, or tell me what you\'d like to do there?\n\nOr pick a shortcut.'),btns:['↩ Quick questions','↩ Talk to a Shark'],time:'14:02',tag:'First unclear reply · rephrase once, ask one specific thing, offer a way out'}),
   B(4,'text',{from:'me',text:'The big one near the sea, he loved it',time:'14:03',tag:'Second unclear reply · counts toward the handover rule'}),
   B(4,'text',{text:T('Thanks for bearing with me. I\'m not getting this right, and I\'d rather not guess with your money. 🙂\n\nI\'ll bring in a Travel Shark. They can see our chat, so you won\'t need to repeat anything.\n\nHow would you like to carry on?'),btns:['↩ Chat with a Shark','↩ Call me back','↩ Quick questions'],time:'14:03',tag:'Handover · after two unclear replies, or at once if the customer asks for a person or sounds frustrated'}),
   B(5,'text',{from:'me',text:'Call me back',time:'14:03',tag:'Button reply · opens a WhatsApp Flow, the short form below'}),
   B(6,'sys',{text:'Kemi, a Travel Shark, joined the chat'}),
   B(6,'text',{sender:'Kemi · Travel Shark',color:'#0B7D84',text:T('Hi Tunde, it\'s Kemi from TravelTank 👋 I\'ve read your chat: food and culture for two, late August for about a month, up to '+NAIRA+'3m each. Your brother\'s trip sounds like the one to find out about.\n\nI\'ll call you on this number in about 10 minutes. If you\'d rather type, reply here and I\'ll carry on in the chat.'),time:'14:04',tag:'The Shark\'s screen shows: request as understood · budget per person and in total · three ideas shown, none chosen · two messages not understood · reason for handover · call requested for this number'})
  ],
  notes:{
   design:['Typing is optional. The first message invites it, and the quick questions stay one tap away for anyone who would rather tap.','Before searching, the assistant says back what it understood in the customer\'s terms, with one tap to confirm or change. It is the cheapest way to catch a wrong reading, such as a budget meant per person or in total.','When it is not sure it says so plainly and asks one specific thing. It never fills the gap with a guess.','The way out is on screen at the moment of doubt, not buried in a menu. The chat shows one business name, so the handover says a person has joined.'],
   biz:['Many people will simply type, as they would to a friend, and a fixed menu feels slower than that. This keeps them in the chat instead of losing them to a call or a close.','Someone who is stuck gets a person at the point of doubt, which is where calls to the 24/7 line start today. A good handover protects the sale.','Suggested rules for handing over: two unclear replies, any request for a person, a frustrated tone, and topics the assistant should not handle, such as groups, multi-city trips, visa questions and special assistance.','Staffing is the real cost. A handover queue needs hours, a response target and an honest out-of-hours message. A callback lets a small team batch its calls.','Measure typed against tapped starts, understood first time, handover rate and reasons, time to a Shark, and conversion after a handover.'],
   build:['Reading free text can use rules, a language model, or both. Whichever it is, it only fills the same fields the buttons fill: mood, party size, dates and budget. It never writes fares or makes promises. [confirm]','A language model means customer text goes to a processor. That needs a data protection review, a clear statement that the assistant is automated, and a rule that passport numbers and similar details are never asked for in free text. [confirm]','Meta restricts general-purpose AI assistants on its Business Platform. A task-specific travel assistant should be in scope, but confirm the current policy with the provider before building. [confirm]','A handover creates an inbox conversation with a summary: the request as understood, what was shown, the messages it could not read, the reason and the contact preference. The Shark replies in the same thread.','Call me back is a WhatsApp Flow that writes a callback task for the call centre, with the number prefilled. A dial button is not available in a session message, so call options are a Flow, an approved template with a call button, or WhatsApp Business Calling. [confirm]','Out of hours, or when the queue is long, the message says so and offers a callback for the next opening time, so nobody waits in silence.']}
 }},

{id:'opt-in',n:1,title:'Opt in where the number is already asked',
 kicker:'Checkout, traveller info',tag:['ex','Existing screen, one new row'],url:'traveltank.com/booking/traveller-info',
 lede:'This page already asks for a mobile number and sells SMS booking details for '+NAIRA+'3,000. Offer WhatsApp beside it, free, and make that tick the consent record for every message that follows.',
 screen:contact,chat:{name:'TravelTank',sub:'Business account',biz:true},
 steps:[
  {cap:'Today the only way to get booking details on your phone is SMS, at '+NAIRA+'3,000.',site:{before:true,wa:'',cont:false},ph:{view:'idle',note:'There is no WhatsApp channel yet.'}},

  {cap:'Tunde ticks it. The wording names his number, what he will get and how to stop.',site:{wa:'ticked'},ph:{view:'idle',note:'Consent is recorded with the wording shown and a timestamp.'}},
  {cap:'On Continue, TravelTank sends a first message. The chat now exists on his phone.',site:{wa:'ticked',cont:true},ph:{view:'chat'}},
  {cap:'Tunde replies. That opens a 24-hour window in which a Shark can answer freely.',site:{wa:'ticked',cont:true},ph:{view:'chat'}}
 ],
 msgs:[

  B(3,'text',{text:T('Hi Tunde, this is *TravelTank*. 👋\nYou\'ve chosen to get updates on your trip to *London* here. We\'ll send your booking, payment reminders and flight changes, nothing else.\n\nReply *STOP* at any time to opt out.'),btns:['↩ Got it','↩ Talk to a Shark'],tag:'Utility template · business-initiated · opt-in confirmation',time:'14:21'}),
  B(4,'text',{from:'me',text:'Got it 👍',time:'14:21',tag:'Customer reply · opens a 24h service window'}),

 ],
 notes:{

  biz:['Replaces a paid add-on that few people choose with a free opt-in. Each tick is a consented, reachable contact.','Owner decision: SMS is a '+NAIRA+'3,000 line today. Suggest keeping it for anyone who prefers it.','Measure opt-in rate at checkout, then hold-to-paid conversion for opted-in against not.'],
  build:['Store consent: timestamp, wording version, number, user and booking id.','WhatsApp Business Platform (Cloud API), direct or through a Business Solution Provider. Verified business, display name TravelTank.','The first business-initiated message must be an approved template. Category: utility.','Normalise numbers to E.164 (+234…) before sending.']}},


{id:'travellers',title:'Let each traveller add their own details',
 kicker:'Checkout, traveller info',tag:['ex','Existing passenger form, new option'],url:'traveltank.com/booking/traveller-info',

 screen:travellers,chat:{name:'TravelTank',sub:'Business account',biz:true},chats:{tunde:{name:'Ada',sub:'online',biz:false},ada:{name:'TravelTank',sub:'Business account',biz:true}},
 steps:[
  {cap:'Today the booker types every passenger\'s name and date of birth, and has to chase friends for them.',site:{before:true},ph:{view:'idle',note:'Details are collected by messaging people separately.'}},

 ],
 msgs:[

  B(3,'text',{scene:'ada',text:T('Hi Ada \uD83D\uDC4B Tunde is booking Lagos \u2192 London on Fri 21 Aug for you both.\n\nYour name must match your passport exactly. Ready?'),btns:['\u21A9 Add my details'],time:'14:33',tag:'Session message \u00B7 the button opens a WhatsApp Flow'}),

 ],
 notes:{
  design:['The option sits inside the extra passenger, exactly where the missing details are.','TravelTank cannot message Ada first. She gets a link from Tunde and chooses to start the chat.','The form is a native WhatsApp form, so Ada never leaves the app. Tunde can still type everything himself.'],
  biz:['Each traveller enters their name from their own passport, which reduces name mismatches that can lead to correction fees or refused boarding.','A group booking is no longer held up while the booker chases details.','Ada becomes a consented contact in her own right.','Measure completion by link, time to complete traveller details and name-correction requests.'],
  build:['One-time token tied to booking and passenger slot. It expires and needs no account or payment.','The Flow returns structured fields and runs basic validation, such as letters only in names.','Opening the chat is customer-initiated, so the first reply is free-form.','Passport numbers are sensitive. Collect them only when the supplier needs them, and store accordingly.']}},
{id:'hold',n:3,title:'A 72-hour hold that does not slip away',

function calc(x){
  var R=x.value*x.margin/100, O=x.optin/100, U=x.mult;
  var holds=x.holds*O*(x.holdLift*U)/100;
  var T=x.bookings*x.bankShare/100;
  var bank=T*(x.bankLoss/100)*Math.min(1,x.bankCut/100*U)*O;
  var alerts=x.bookings*O*(x.alerts*U)/100;
  var extras=x.bookings*O*(x.extrasLift*U)/100;
  var cO=x.bookings*O*x.contacts, defl=cO*(x.statusShare/100)*Math.min(0.9,x.statusAvoid/100*U);
  var shifted=(cO-defl)*x.moveChat/100;
  var parts={
    holds:holds*R, bank:bank*R, alerts:alerts*R, extras:extras*x.extraSale*x.extraMargin/100,
    support:defl*x.phoneCost+shifted*Math.max(0,x.phoneCost-x.chatCost),
    sms:-(x.bookings*x.smsTake/100*O*x.smsPrice),
    msg:-(x.bookings*O*(x.utilN*x.utilRate+x.mktN*x.mktRate)),
    platform:-x.platform
  };
  var gain=parts.holds+parts.bank+parts.alerts+parts.extras+parts.support;
  var variable=parts.sms+parts.msg;
  return {parts:parts,gain:gain,variable:variable,net:gain+variable+parts.platform,extra:holds+bank+alerts};
}
function cumulative(x,r){
  var c=[-x.oneoff];
  for(var m=1;m<=24;m++){var f=Math.min(1,m/x.ramp); c.push(c[m-1]+f*(r.gain+r.variable)+r.parts.platform);}
  return c;
}
function breakEven(x){
  var a=Object.assign({},x,{optin:0}), b=Object.assign({},x,{optin:100});
  var n0=calc(a).net, n100=calc(b).net, slope=(n100-n0)/100;
  if(slope<=0) return null; return -n0/slope;
}

function caseUpdate(){
  var r=calc(CS), cum=cumulative(CS,r), be=breakEven(CS);
  var pb=-1; for(var m=1;m<=24;m++){ if(cum[m]>=0){pb=m;break;} }
  document.getElementById('cs-kpis').innerHTML=
   '<div class="cs-kpi"><span>Net benefit per month</span><b>'+fm(r.net)+'</b><small>at full adoption</small></div>'+
   '<div class="cs-kpi"><span>Payback</span><b>'+(pb>0?'Month '+pb:'Over 24 mo')+'</b><small>on '+fm(CS.oneoff)+' build</small></div>'+
   '<div class="cs-kpi"><span>First 12 months</span><b>'+fm(cum[12])+'</b><small>after build cost</small></div>'+
   '<div class="cs-kpi"><span>Break-even opt-in</span><b>'+(be===null?'None':be>100?'Over 100%':Math.max(0,be).toFixed(0)+'%')+'</b><small>with these assumptions</small></div>';
  // scenario pressed state
  Array.prototype.forEach.call(document.querySelectorAll('[data-scn]'),function(b){var sc=CASE_SCN[b.dataset.scn];b.setAttribute('aria-pressed',String(sc.optin===CS.optin&&sc.mult===CS.mult));});
  // bars
  var P=r.parts, rows=[['Hold conversion',P.holds],['Bank transfer recovery',P.bank],['Alerts and shares',P.alerts],['Extras sold',P.extras],['Support savings',P.support],['SMS income lost',P.sms],['WhatsApp message fees',P.msg],['Platform and inbox',P.platform]];
  var mx=Math.max.apply(null,rows.map(function(x){return Math.abs(x[1]);}).concat([1]));
  document.getElementById('cs-bars').innerHTML=rows.map(function(x){
    var w=Math.max(0,Math.abs(x[1])/mx*100);
    return '<div class="cs-bar'+(x[1]<0?' neg':'')+'" data-tip="'+x[0]+': '+fm(x[1])+' per month"><span>'+x[0]+'</span><div class="tr"><div class="fl" style="left:0;width:'+w.toFixed(1)+'%"></div></div><span class="v">'+fm(x[1])+'</span></div>';
  }).join('')+'<div class="cs-bar tot"><span>Net per month</span><div></div><span class="v">'+fm(r.net)+'</span></div>'+
   '<p class="sub" style="margin-top:8px">About '+fnum(r.extra)+' extra paid bookings a month from holds, bank transfers and alerts.</p>';
  drawLine(cum,pb); drawTorn(r.net);
  // tables
  var tr=rows.map(function(x){return '<tr><td>'+x[0]+'</td><td>'+fm(x[1])+'</td></tr>';}).join('')+'<tr><td><b>Net per month</b></td><td><b>'+fm(r.net)+'</b></td></tr>';
  var cr=[0,1,3,6,9,12,18,24].map(function(m){return '<tr><td>Month '+m+'</td><td>'+fm(cum[m])+'</td></tr>';}).join('');
  document.getElementById('cs-tbl').innerHTML='<table><thead><tr><th>Monthly lever</th><th>Value</th></tr></thead><tbody>'+tr+'</tbody></table><table style="margin-top:10px"><thead><tr><th>Cumulative</th><th>Value</th></tr></thead><tbody>'+cr+'</tbody></table>';
  try{ localStorage.setItem('tt-case',JSON.stringify(CS)); }catch(e){}
}

function niceStep(rng){var raw=rng/4,mag=Math.pow(10,Math.floor(Math.log(raw)/Math.LN10)),n=raw/mag;return (n<1.5?1:n<3?2:n<7?5:10)*mag;}
function drawLine(cum,pb){
  var W=640,H=250,ml=58,mr=14,mt=14,mb=28, lo=Math.min.apply(null,cum.concat([0])), hi=Math.max.apply(null,cum.concat([0]));
  var st=niceStep(hi-lo||1); lo=Math.floor(lo/st)*st; hi=Math.ceil(hi/st)*st;
  function X(m){return ml+m/24*(W-ml-mr);} function Y(v){return mt+(hi-v)/(hi-lo)*(H-mt-mb);}
  var g='',t=[]; for(var v=lo;v<=hi+st/2;v+=st){t.push(v);}
  t.forEach(function(v){g+='<line class="g" x1="'+ml+'" x2="'+(W-mr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text x="'+(ml-8)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+fm(v)+'</text>';});
  [0,6,12,18,24].forEach(function(m){g+='<text x="'+X(m)+'" y="'+(H-8)+'" text-anchor="middle">'+(m===0?'Start':'M'+m)+'</text>';});
  var d=cum.map(function(v,m){return (m?'L':'M')+X(m).toFixed(1)+' '+Y(v).toFixed(1);}).join(' ');
  var area=d+' L'+X(24)+' '+Y(0)+' L'+X(0)+' '+Y(0)+' Z';
  var mk=pb>0?'<circle class="pb" cx="'+X(pb)+'" cy="'+Y(cum[pb])+'" r="5"/><text class="lbl" x="'+X(pb)+'" y="'+(Y(cum[pb])-12)+'" text-anchor="'+(pb>16?'end':'start')+'">Payback, month '+pb+'</text>':'';
  document.getElementById('cs-line').innerHTML='<svg class="cs-svg" id="cs-lsvg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Cumulative net result over 24 months">'+g+
   '<line class="z" x1="'+ml+'" x2="'+(W-mr)+'" y1="'+Y(0)+'" y2="'+Y(0)+'"/><path class="ar" d="'+area+'"/><path class="ln" d="'+d+'"/>'+mk+
   '<line class="hv" id="cs-hv" y1="'+mt+'" y2="'+(H-mb)+'" x1="0" x2="0" style="display:none"/><circle class="pb" id="cs-hd" r="5" cx="0" cy="0" style="display:none"/></svg>';
  var svg=document.getElementById('cs-lsvg'), res=document.getElementById('cs-res'), tip=document.getElementById('cs-tip');
  svg.addEventListener('mousemove',function(e){
    var b=svg.getBoundingClientRect(), x=(e.clientX-b.left)/b.width*W, m=Math.max(0,Math.min(24,Math.round((x-ml)/(W-ml-mr)*24)));
    var hv=document.getElementById('cs-hv'), hd=document.getElementById('cs-hd'); hv.style.display='';hd.style.display=''; hv.setAttribute('x1',X(m)); hv.setAttribute('x2',X(m)); hd.setAttribute('cx',X(m)); hd.setAttribute('cy',Y(cum[m]));
    var rb=res.getBoundingClientRect(); tip.hidden=false; tip.textContent=(m===0?'Start':'Month '+m)+': '+fm(cum[m]);
    tip.style.left=(b.left-rb.left+X(m)/W*b.width)+'px'; tip.style.top=(b.top-rb.top+Y(cum[m])/H*b.height-8)+'px';
  });
  svg.addEventListener('mouseleave',function(){tip.hidden=true;document.getElementById('cs-hv').style.display='none';document.getElementById('cs-hd').style.display='none';});
}
function drawTorn(base){
  var rows=TORN.map(function(t){
    var k=t[0], lo=Object.assign({},CS), hi=Object.assign({},CS);
    lo[k]=CS[k]*0.5; hi[k]=k==='optin'?Math.min(100,CS[k]*1.5):CS[k]*1.5;
    var a=calc(lo).net-base, b=calc(hi).net-base; return {n:t[1],a:a,b:b,sw:Math.abs(a)+Math.abs(b)};
  }).sort(function(p,q){return q.sw-p.sw;}).slice(0,7);
  var ext=Math.max.apply(null,rows.map(function(r){return Math.max(Math.abs(r.a),Math.abs(r.b));}).concat([1]));
  var W=640,rh=30,lw=150,mid=lw+(W-lw)/2,half=(W-lw)/2-14,H=rows.length*rh+30,sv='';
  rows.forEach(function(r,i){
    var y=i*rh+6;
    sv+='<text x="0" y="'+(y+15)+'" style="fill:var(--ink)">'+r.n+'</text>';
    [['a','50% lower'],['b','50% higher']].forEach(function(pair){
      var v=r[pair[0]],w=Math.abs(v)/ext*half,x=v>=0?mid:mid-w;
      sv+='<rect x="'+x.toFixed(1)+'" y="'+(y+3)+'" width="'+Math.max(1,w).toFixed(1)+'" height="14" rx="3" class="'+(v>=0?'pos':'neg')+'" data-tip="'+r.n+', '+pair[1]+': '+(v>=0?'+':'')+fm(v)+' per month"/>';
    });
  });
  sv+='<line class="z" x1="'+mid+'" x2="'+mid+'" y1="0" y2="'+(rows.length*rh+8)+'"/>'+
   '<text x="'+mid+'" y="'+(H-4)+'" text-anchor="middle">Base case net per month</text>';
  document.getElementById('cs-torn').innerHTML='<svg class="cs-svg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Sensitivity of monthly net benefit to each assumption">'+sv+'</svg>';
}
function caseInit(){
  var root=document.getElementById('case'), res=document.getElementById('cs-res'), tip=document.getElementById('cs-tip');
  root.addEventListener('input',function(e){

    CS[k]=v; Array.prototype.forEach.call(root.querySelectorAll('[data-k="'+k+'"]'),function(o){if(o!==t)o.value=v;}); caseUpdate();
  });

  caseUpdate();
}

    if(st[2]) tp+='<div class="later"><em>Also</em>'+st[2]+'</div>';
    return '<div class="jm-st"><h4>'+st[0]+'</h4><div class="jm-line"><i></i></div><div class="jm-tp">'+tp+'</div></div>';}).join('');
  var obs=[
   ['The homepage promises Sharks 24/7 and a refund tracker','Homepage cards','home'],
   ['The search box assumes you know where you are going, and inspiration is a weekly deals list','Homepage search and deals','ideas'],
   ['Hotel and flight pages offer help as a phone number only','Need help? panel','hotel'],
   ['Track price and Share are buttons, and the site promises to notify you of price changes','Flight details','track'],
   ['The SMS option costs '+NAIRA+'3,000 at checkout','Traveller info page','opt-in'],
   ['Names must match ID, and the booker types them for everyone','Traveller info page','travellers'],
   ['Holds are released in 72 hours if no payment is received','Payment page','hold'],
   ['Bank transfer details go on screen and by email only','Payment page','bank'],
   ['Fares can be non-refundable, and Cancel is one button','Confirmation page','refund']
  ].map(function(o){return '<div class="ob"><q>'+o[1]+'</q><strong>'+o[0]+'</strong><button data-go="'+o[2]+'">See the idea &rarr;</button></div>';}).join('');
  var eff=[
   ['1. Homepage chat, refunds, deals','Cheap first contact, fewer repeat refund calls','wa.me links, auto-reply menu, case lookup, Channel','m','Chats started, resolved without an agent'],
   ['2. Trip ideas, then traveller details','Reaches the undecided, and lands on a high-intent step','wa.me entry, fare search, cards, deep link with token. Typing in own words adds text understanding and a Shark handover queue, which is higher effort','m','Chat-to-traveller-page rate, hold or paid, handover rate'],
   ['3. Ask a Shark with context','Answers at the moment of doubt','Prefilled link, agent inbox','l','Conversion of chat against non-chat sessions'],
   ['4. Track price and share','Return visits and new visitors','Alert subscriptions, marketing templates, share links','m','Alert-to-booking rate, shares per fare'],
   ['5. Opt in at checkout','Consented contact for everything else','Cloud API, consent log, first template','m','Opt-in rate'],
   ['6. Traveller details by link','Faster group bookings, fewer name errors','Tokenised link, WhatsApp Flow','m','Completion by link'],
   ['7. Hold reminders','Holds that turn into payments','Templates, scheduler, payment links','m','Hold-to-paid rate'],
   ['8. Bank transfer and receipts','Faster, calmer confirmation','Media handling, agent inbox, finance event','h','Receipt-to-confirmed time'],
   ['9. Tickets and a Shark','Fewer calls, more extras sold','Document template, inbox, handoff rules','h','Calls per booking, extras attach'],
   ['10. Pre-trip care','Trust and add-on sales','Triggers, preference store, marketing consent','h','Opt-out rate, add-on attach'],
   ['11. Cancel and refund tracker','Fewer repeat contacts','Case management, status events','h','Contacts per refund case']
  ];
  var lvl={l:'Low',m:'Medium',h:'Higher'};
  var rows=eff.map(function(r){return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td><td><span class="lv '+r[3]+'">'+lvl[r[3]]+'</span></td><td>'+r[4]+'</td></tr>';}).join('');
  return '<div class="hero"><div class="kicker">Concept prototype</div><h1>WhatsApp, woven into the TravelTank booking journey</h1>'+
   '<p>Eleven touchpoints, designed on the real site from homepage to refund. Each one pairs a TravelTank screen with the WhatsApp conversation it triggers, and can be stepped through. Use the toggles to see today\'s site, or the build tags.</p>'+(SHOW_CASE?'<p style="margin-top:16px"><button class="nb pri" data-go="case">Open the business case &rarr;</button></p>':'')+'</div>'+
   '<div class="sec"><h2>What the current site tells us</h2><p class="sub">Each touchpoint starts from something the site already does or promises.</p><div class="obs">'+obs+'</div></div>'+
   '<div class="sec"><h2>The journey</h2><p class="sub">Numbers follow the customer\'s order. Select one to open it.</p><div class="jm"><div class="jm-grid">'+jm+'</div></div></div>'+
   '<div class="sec"><h2>At a glance</h2><p class="sub">Effort is indicative and needs to be confirmed with the tech partner.</p><div class="tbl"><table><thead><tr><th>Touchpoint</th><th>What it buys</th><th>What it needs</th><th>Effort</th><th>Measure</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'+
   '<div class="sec"><div class="two"><div class="card"><h3>Ground rules</h3><ul><li>Opt-in is explicit and unticked. Marketing consent is separate from service messages.</li><li>WhatsApp carries the conversation. Card payments stay on the site or a hosted payment page.</li><li>A Shark is always one tap away, and the booking is attached.</li><li>Every message can be stopped by replying STOP, and from My Account.</li><li>Messages outside the 24-hour window use approved templates only.</li></ul></div>'+
   '<div class="card"><h3>Decisions for the owner</h3><ul><li>SMS at '+NAIRA+'3,000: keep, reprice or retire.</li><li>One dedicated WhatsApp number for TravelTank, or reuse the 24/7 line.</li><li>Staffing and hours for the WhatsApp inbox, and out-of-hours wording.</li><li>Which Business Solution Provider, and who owns the template library.</li><li>Data protection review of consent wording and retention.</li></ul></div>'+
   '<div class="card"><h3>Later phases</h3><ul><li>Visa concierge: checklist, document uploads and status.</li><li>Holiday enquiries in chat, with the itinerary as a PDF.</li><li>WhatsApp code at sign-in, using the mobile number already collected.</li><li>Click-to-WhatsApp from Instagram and Facebook posts and ads.</li><li>Post-trip review and rebooking.</li></ul></div></div></div>'+
   '<p class="fine">All screens are illustrative concepts built from the current TravelTank site. Names, numbers, prices, times and service promises are examples. WhatsApp message categories, pricing and policies change and must be confirmed with Meta or the chosen provider before launch. WhatsApp is a trademark of Meta and this prototype is not affiliated with it.</p>';
}

function render(){
  var s=SCN.filter(function(x){return x.id===state.id;})[0];
  Array.prototype.forEach.call(tabs.children,function(b){b.setAttribute('aria-current',String(b.dataset.go===state.id));});
  if(state.id==='case'){ view.innerHTML=caseHTML(); caseInit(); return; }
  if(!s){ view.innerHTML=overview(); return; }
  view.innerHTML=scenarioHTML(s);
  document.getElementById('tg-tags').checked=state.tags; document.getElementById('tg-today').checked=state.today;
  draw();
}
function go(id,step){
  state.id=id; state.step=step||0; state.path='tap';
  try{ history.replaceState(null,'','#'+id); }catch(e){ try{location.hash=id;}catch(_){} }
  render(); window.scrollTo(0,0);
}
tabs.innerHTML='<button class="tab" data-go="overview">Overview</button>'+SCN.map(function(s){
  var short={'home':'Homepage','ideas':'Trip ideas','hotel':'Ask a Shark','track':'Track and share','opt-in':'Opt in','travellers':'Traveller details','hold':'Hold reminders','bank':'Bank transfer','confirm':'Tickets and a Shark','pretrip':'Pre-trip care','refund':'Cancel and refund'}[s.id];
  return '<button class="tab" data-go="'+s.id+'"><b>'+s.n+'</b>'+short+'</button>';}).join('')+(SHOW_CASE?'<button class="tab" data-go="case"><b>&#8358;</b>Business case</button>':'');
document.addEventListener('click',function(e){
  var g=e.target.closest('[data-go]'); if(g){go(g.dataset.go);return;}
  var pb=e.target.closest('[data-path]'); if(pb){state.path=pb.dataset.path;state.step=0;render();return;}
  var d=e.target.closest('[data-step]'); if(d){state.step=+d.dataset.step;draw();return;}
  if(e.target.id==='nx'){var s=SCN.filter(function(x){return x.id===state.id;})[0]; if(state.step<cur(s).steps.length-1){state.step++;draw();}}
  if(e.target.id==='bk'){ if(state.step>0){state.step--;draw();}}
});
document.addEventListener('change',function(e){
  if(e.target.id==='tg-tags'){state.tags=e.target.checked;draw();}
  if(e.target.id==='tg-today'){state.today=e.target.checked;draw();}
});
document.addEventListener('keydown',function(e){
  if(/INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  var s=SCN.filter(function(x){return x.id===state.id;})[0]; if(!s) return;
  if(e.key==='ArrowRight'&&state.step<cur(s).steps.length-1){state.step++;draw();}
  if(e.key==='ArrowLeft'&&state.step>0){state.step--;draw();}
});
window.addEventListener('resize',fit);
if(window.ResizeObserver){ new ResizeObserver(fit).observe(document.body); }
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(fit);}
var h=(location.hash||'').replace('#','');
if(h&&(h==='overview'||h==='case'||SCN.some(function(x){return x.id===h;}))) state.id=h;
render();
})();
</script>
